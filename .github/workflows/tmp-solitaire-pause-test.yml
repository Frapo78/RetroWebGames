name: solitaire-pause-test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-solitaire-pause-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check games/solitaire/pause-overlay.js
      - run: grep -q 'pause-overlay.css' games/solitaire/index.html && grep -q 'pause-overlay.js' games/solitaire/index.html
      - run: node scripts/validate-solitaire.mjs
      - run: node scripts/validate-contracts.mjs