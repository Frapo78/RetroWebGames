name: One-shot avatar architecture validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-avatar-finalize.yml'

permissions:
  contents: write

jobs:
  finalize-avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize shared avatar contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Repository-wide validator: make avatar validation mandatory.
          p = Path('scripts/validate-contracts.mjs')
          s = p.read_text()
          old = "'scripts/validate-session.mjs','scripts/validate-bubble-burst.mjs','scripts/validate-solitaire.mjs','scripts/validate-prism-breaker.mjs','scripts/validate-social-sharing.mjs','scripts/validate-analytics.mjs','scripts/validate-icons.mjs','scripts/validate-pwa-install.mjs','scripts/validate-lazy-images.mjs','scripts/validate-seo-geo.mjs','scripts/validate-leaderboards.mjs'"
          new = "'scripts/validate-session.mjs','scripts/validate-avatar.mjs','scripts/validate-bubble-burst.mjs','scripts/validate-solitaire.mjs','scripts/validate-prism-breaker.mjs','scripts/validate-social-sharing.mjs','scripts/validate-analytics.mjs','scripts/validate-icons.mjs','scripts/validate-pwa-install.mjs','scripts/validate-lazy-images.mjs','scripts/validate-seo-geo.mjs','scripts/validate-leaderboards.mjs'"
          if old not in s:
              raise SystemExit('specialized validator list marker not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              "console.log('  ✓ Session, social sharing, analytics, icons, PWA install, lazy images, Bubble Burst, Solitario and Prism Breaker specialized validators are green');",
              "console.log('  ✓ Session, Avatar, social sharing, analytics, icons, PWA install, lazy images, Bubble Burst, Solitario and Prism Breaker specialized validators are green');",
              1
          )
          p.write_text(s)

          # Architecture: promote avatar from one-line mention to a real shared contract.
          p = Path('docs/ARCHITECTURE.md')
          s = p.read_text()
          old = """## Avatar

`rwg-avatar.js` renders the shared avatar identity and `/avatar/` is the editor. Games consume shared identity instead of maintaining copies.
"""
          new = """## Avatar / player identity

`rwg-avatar.js` / `rwg-avatar.css` are the authoritative shared player-identity renderer and `/avatar/` is the only editor. Games consume this shared identity and must never maintain local avatar copies.

The current avatar schema is v2 and is built around a scalable SVG **stickman / arcade-player skeleton**. Outfit and gear are presentation layers over that structural body, so the silhouette stays readable both in the large editor preview and in the compact badge beside credits.

The v2 loadout keeps body/face/hair/outfit colors and adds independent `eyewear`, `headgear`, `emblem` and `aura` slots. `rwg.avatar.v1:<fingerprint>` is migrated automatically into `rwg.avatar.v2:<fingerprint>` rather than resetting an existing player's appearance.

The editor is a gaming loadout configurator with Corpo, Testa, Outfit and Gear tabs, live preview, drag-to-rotate, random loadout, undo of unsaved changes and explicit Save. Draft changes must not mutate the stored shared avatar before Save.

See `AVATAR.md` and run `node scripts/validate-avatar.mjs` after avatar changes.
"""
          if old not in s:
              raise SystemExit('architecture Avatar marker not found')
          p.write_text(s.replace(old, new, 1))

          # Agent guardrail: avatar is platform infrastructure, not game-local decoration.
          p = Path('AGENTS.md')
          s = p.read_text()
          marker = '## 5. Star Swarm source of truth\n'
          section = """## 4B. Avatar / player identity — SHARED AND REGRESSION-CRITICAL

The avatar is shared platform infrastructure.

Authoritative files:

- `rwg-avatar.js` / `rwg-avatar.css` — schema, normalization and shared renderer;
- `avatar/index.html`, `avatar/avatar-editor.js`, `avatar/avatar-editor.css` — the only editor;
- `docs/AVATAR.md` — detailed source of truth;
- `scripts/validate-avatar.mjs` — regression guard.

Current schema is **v2**. The base character MUST remain a scalable SVG stickman / arcade-player skeleton with clothing and gear layered on top. Do not regress to the old independent CSS block-doll torso/arms/legs and do not create game-local avatar renderers.

Both renderer modes are mandatory:

- `full` for editor/player identity;
- `mini` for the compact badge beside credits.

Changes to the shared renderer MUST preserve both modes.

Current independent gear slots are `eyewear`, `headgear`, `emblem` and `aura`. Do not collapse them back into the legacy combined `accessory` field.

Existing v1 users MUST migrate without losing their avatar. The v1 combined accessory maps glasses/visor to `eyewear`, cap/headphones to `headgear`, while new gear fields receive safe defaults. Do not remove that migration path without an explicit migration strategy.

The editor uses four gaming loadout tabs: Corpo, Testa, Outfit and Gear. Unsaved draft changes MUST NOT mutate the globally stored avatar until explicit Save.

Run `node scripts/validate-avatar.mjs` after any avatar renderer/editor/schema change. The repository-wide validator invokes it automatically.

"""
          if '## 4B. Avatar / player identity' not in s:
              if marker not in s:
                  raise SystemExit('AGENTS insertion marker not found')
              s = s.replace(marker, section + marker, 1)
          p.write_text(s)
          PY
      - name: Validate avatar
        run: node scripts/validate-avatar.mjs
      - name: Validate repository contracts
        run: node scripts/validate-contracts.mjs
      - name: Commit finalized avatar architecture and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Fra"
          git config user.email "40823974+Frapo78@users.noreply.github.com"
          rm -f .github/workflows/tmp-avatar-finalize.yml
          git add scripts/validate-contracts.mjs docs/ARCHITECTURE.md AGENTS.md .github/workflows/tmp-avatar-finalize.yml
          git commit -m "docs(avatar): enforce shared gaming identity contract"
          git push origin main
