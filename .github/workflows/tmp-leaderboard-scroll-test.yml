name: leaderboard-scroll-test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-leaderboard-scroll-test.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check rwg-leaderboard-infinite.js
      - run: node --test server/leaderboards/test.mjs
      - run: node scripts/validate-leaderboards.mjs
      - run: node scripts/validate-contracts.mjs
