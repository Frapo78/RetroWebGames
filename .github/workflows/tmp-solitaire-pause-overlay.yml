name: solitaire-pause-overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-solitaire-pause-overlay.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire pause overlay and guardrails
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Page assets.
          p = Path('games/solitaire/index.html')
          s = p.read_text()
          css_marker = '  <link rel="stylesheet" href="style.css" />\n'
          if 'pause-overlay.css' not in s:
              if css_marker not in s: raise SystemExit('solitaire CSS marker missing')
              s = s.replace(css_marker, css_marker + '  <link rel="stylesheet" href="pause-overlay.css" />\n', 1)
          js_marker = '  <script src="game.js"></script>\n'
          if 'pause-overlay.js' not in s:
              if js_marker not in s: raise SystemExit('solitaire JS marker missing')
              s = s.replace(js_marker, js_marker + '  <script src="pause-overlay.js"></script>\n', 1)
          p.write_text(s)

          # Specialized validator.
          p = Path('scripts/validate-solitaire.mjs')
          s = p.read_text()
          old = "'games/solitaire/game.js','games/solitaire/session-adapter.js'"
          new = "'games/solitaire/game.js','games/solitaire/pause-overlay.js','games/solitaire/session-adapter.js'"
          if old in s:
              s = s.replace(old, new, 1)
          elif 'games/solitaire/pause-overlay.js' not in s:
              raise SystemExit('validator JS list marker missing')

          marker = "must(html.includes('id=\"pauseBtn\"'), 'Solitaire must expose pauseBtn for shared lifecycle');\n"
          addition = """must(html.includes('pause-overlay.css') && html.includes('pause-overlay.js'), 'Solitaire must load the dedicated transparent pause overlay assets');
must(html.indexOf('game.js') < html.indexOf('pause-overlay.js') && html.indexOf('pause-overlay.js') < html.indexOf('session-adapter.js'), 'Solitaire pause overlay must bind after game runtime and before the persistence wrapper');
"""
          if addition.strip() not in s:
              if marker not in s: raise SystemExit('validator pauseBtn marker missing')
              s = s.replace(marker, marker + addition, 1)

          marker = "const inputGuard = read('games/solitaire/input-guard.js');\n"
          addition = """const pauseOverlay = read('games/solitaire/pause-overlay.js');
const pauseOverlayCss = read('games/solitaire/pause-overlay.css');
for (const marker of ['GIOCO IN PAUSA','| |','solitairePauseResume','aria-label=\"Riprendi il gioco\"','MutationObserver','pauseBtn.click()','visibilitychange']) {
  must(pauseOverlay.includes(marker), `Solitaire pause overlay behavior missing: ${marker}`);
}
must(pauseOverlay.includes("pauseBtn.getAttribute('aria-label') === 'Riprendi'"), 'Pause overlay must derive visibility from the authoritative pause state');
must(pauseOverlay.includes("RWGAnalytics?.track?.('solitaire_pause_overlay'"), 'Pause overlay resume/show interactions must remain measurable');
for (const marker of ['.solitaire-pause-overlay','.solitaire-pause-overlay.visible','.solitaire-pause-title','.solitaire-pause-resume','pointer-events:none','pointer-events:auto','rgba(255,253,244,.78)']) {
  must(pauseOverlayCss.includes(marker), `Solitaire transparent arcade pause styling missing: ${marker}`);
}

"""
          if "const pauseOverlay = read('games/solitaire/pause-overlay.js');" not in s:
              if marker not in s: raise SystemExit('validator inputGuard marker missing')
              s = s.replace(marker, addition + marker, 1)
          p.write_text(s)

          # Human documentation.
          p = Path('docs/SOLITAIRE.md')
          s = p.read_text()
          if '- `games/solitaire/pause-overlay.js`' not in s:
              s = s.replace(
                  '- `games/solitaire/game.js` — authoritative gameplay runtime and logical resume adapter\n',
                  '- `games/solitaire/game.js` — authoritative gameplay runtime and logical resume adapter\n- `games/solitaire/pause-overlay.js` / `pause-overlay.css` — transparent arcade pause-state presentation and tap-to-resume control\n',
                  1
              )
          s = s.replace(
              'Load order is `variants.js` → `card-art.js` → `input-guard.js` → `auto-move.js` → `auto-finish.js` → `game.js` → `session-adapter.js` → shared `game-hud.js` → `orientation.js`.',
              'Load order is `variants.js` → `card-art.js` → `input-guard.js` → `auto-move.js` → `auto-finish.js` → `game.js` → `pause-overlay.js` → `session-adapter.js` → shared `game-hud.js` → `orientation.js`.'
          )
          pause_anchor = '- `pauseBtn` is mandatory because shared `orientation.js` uses it during smartphone rotation.\n'
          pause_doc = """
### Pause-state clarity — CRITICAL

Whenever Solitario is paused, the table must remain visible but the pause state must be unmistakable. `pause-overlay.js` derives its state from the authoritative `#pauseBtn` ARIA state rather than owning a second pause flag.

- a translucent arcade overlay displays **GIOCO IN PAUSA** over the table;
- the row below exposes the classic `| |` pause glyph as the only clickable element of the overlay;
- tapping that glyph delegates to the existing `#pauseBtn` resume action, so timer, autosave and game state continue to use the normal runtime path;
- the overlay also appears after automatic background/`visibilitychange` pause when the page becomes visible again;
- intro, victory and new-deal confirmation surfaces take precedence and hide the pause presentation;
- the overlay must not become an opaque modal that hides the card layout.

"""
          if '### Pause-state clarity — CRITICAL' not in s:
              if pause_anchor not in s: raise SystemExit('docs pause anchor missing')
              s = s.replace(pause_anchor, pause_anchor + pause_doc, 1)
          if 'node --check games/solitaire/pause-overlay.js' not in s:
              s = s.replace('node --check games/solitaire/game.js\n', 'node --check games/solitaire/game.js\nnode --check games/solitaire/pause-overlay.js\n', 1)
          if '- manual pause shows the translucent `GIOCO IN PAUSA` overlay' not in s:
              s = s.replace('- rapid double taps on cards without page zoom;\n', '- manual pause shows the translucent `GIOCO IN PAUSA` overlay and tapping `| |` resumes the exact hand;\n- returning from an automatic background pause shows the same pause overlay;\n- rapid double taps on cards without page zoom;\n', 1)
          p.write_text(s)

          # Agent source-of-truth guardrail.
          p = Path('AGENTS.md')
          s = p.read_text()
          if '- `games/solitaire/pause-overlay.js` / `pause-overlay.css`' not in s:
              s = s.replace(
                  '- `games/solitaire/game.js` — gameplay and logical snapshot implementation;\n',
                  '- `games/solitaire/game.js` — gameplay and logical snapshot implementation;\n- `games/solitaire/pause-overlay.js` / `pause-overlay.css` — transparent arcade pause presentation;\n',
                  1
              )
          pause_rule = '- Paused Solitario must show the translucent shared-state presentation `GIOCO IN PAUSA` with a clickable `| |` resume glyph; the overlay derives pause state from `#pauseBtn` and must not own a second pause flag.\n'
          anchor = '- The in-game Solitario `NUOVA` control must ask for explicit confirmation before abandoning an active deal.'
          if pause_rule not in s and anchor in s:
              s = s.replace(anchor, pause_rule + anchor, 1)
          p.write_text(s)
          PY
      - name: Validate Solitaire pause overlay
        run: |
          node --check games/solitaire/pause-overlay.js
          node scripts/validate-solitaire.mjs
          node scripts/validate-contracts.mjs
      - name: Commit final changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Fra"
          git config user.email "40823974+Frapo78@users.noreply.github.com"
          rm -f .github/workflows/tmp-solitaire-pause-overlay.yml
          git add games/solitaire/index.html games/solitaire/pause-overlay.js games/solitaire/pause-overlay.css scripts/validate-solitaire.mjs docs/SOLITAIRE.md AGENTS.md .github/workflows/tmp-solitaire-pause-overlay.yml
          git commit -m "feat(solitaire): make paused state unmistakable"
          git push origin main