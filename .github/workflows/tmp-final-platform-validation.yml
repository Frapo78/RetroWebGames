name: Final one-shot platform validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove obsolete duplicate favicon aliases
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          pages=[Path('index.html'),Path('avatar/index.html')]+sorted(Path('games').glob('*/index.html'))
          for page in pages:
              text=page.read_text()
              text=re.sub(r'^\s*<link rel="shortcut icon" href="https://www\.retrowebgames\.it/favicon\.svg"\s*/?>\s*\n?', '', text, flags=re.M)
              page.write_text(text)
          PY
      - name: Analytics contracts
        run: node scripts/validate-analytics.mjs
      - name: Icon contracts
        run: node scripts/validate-icons.mjs
      - name: Repository contracts
        run: node scripts/validate-contracts.mjs
      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "Fra"
          git config user.email "40823974+Frapo78@users.noreply.github.com"
          git rm .github/workflows/tmp-final-platform-validation.yml
          git add -A
          git commit -m "chore(platform): finalize analytics and icon contracts"
          git push origin HEAD:main
