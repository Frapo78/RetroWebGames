<body data-rwg-game="true" data-rwg-game-name="The Great Empire">
  <main id="app">
    <header id="hud">
      <div class="v-food"><span>FOOD</span><strong id="food">0</strong></div>
      <div class="v-wood"><span>WOOD</span><strong id="wood">0</strong></div>
      <div class="v-gold"><span>GOLD</span><strong id="gold">0</strong></div>
    </header>
    <div id="hud2">
      <span>POP <strong id="pop">0/4</strong></span>
      <span>LVL <strong id="level">1</strong></span>
      <span>AGE <strong id="age">STONE</strong></span>
      <span>POINTS <strong id="score">0</strong></span>
    </div>

    <div id="topbar">
      <a class="icon-btn" href="/en/" aria-label="Back to RetroWebGames">⌂</a>
      <button id="muteBtn" class="icon-btn" aria-label="Toggle audio">🔊</button>
      <button id="pauseBtn" class="icon-btn" aria-label="Pause">Ⅱ</button>
    </div>

    <section id="arenaWrap">
      <canvas id="game" aria-label="The Great Empire map"></canvas>
      <div id="status" aria-live="polite">READY</div>
    </section>

    <section id="actions" aria-label="Commands" hidden>
      <button id="trainVillager" class="act train" type="button"><b>VILLAGER</b><i>50🌾</i></button>
      <button id="trainClubman" class="act train" type="button"><b>WARRIOR</b><i>60🌾 20🪙</i></button>
      <button id="trainArcher" class="act train" type="button"><b>ARCHER</b><i>50🌾 35🪵</i></button>
      <button id="trainCavalry" class="act train" type="button"><b>CAVALRY</b><i>80🌾 60🪙</i></button>

      <button id="buildHouse" class="act build" type="button"><b>HOUSE</b><i>40🪵 +4 pop</i></button>
      <button id="buildTower" class="act build" type="button"><b>TOWER</b><i>110🪵 40🪙</i></button>
      <button id="advanceAge" class="act age" type="button"><b>→ BRONZE</b><i>220🌾 90🪵</i></button>

      <button id="selectVillagers" class="act pick" type="button"><b>VILLAGERS</b></button>
      <button id="selectSoldiers" class="act pick" type="button"><b>SOLDIERS</b></button>
      <button id="attackAll" class="act assault" type="button"><b>ASSAULT</b></button>
      <p id="trainState" hidden></p>
    </section>

    <section id="overlay" class="visible">
      <div class="panel">
        <p class="eyebrow">RETROWEBGAMES • STRATEGY</p>
        <nav class="rwg-language-switcher" aria-label="Language"><a href="/games/the-great-empire/" data-rwg-language="it">IT</a><a href="/en/games/the-great-empire/" data-rwg-language="en" aria-current="page">EN</a></nav>
        <h1 class="rwg-intro-cover-title"><img src="/assets/social/games/the-great-empire.jpg" width="1200" height="630" alt="The Great Empire" decoding="async" fetchpriority="high" /></h1>
        <p id="overlayText" class="rwg-intro-runtime-copy" aria-live="polite"></p>
        <div class="rwg-intro-leaderboard-slot" aria-label="Loading High Scores"><span>🏆 HIGH SCORES</span></div>
        <div class="stats-line">RECORD <strong id="best">0</strong></div>
        <button id="startBtn" class="primary-btn">PLAY</button>
        <a class="primary-btn rwg-intro-secondary" href="/en/">BACK TO MENU</a>
        <p class="hint">Portrait • tap a unit, then tap its destination<br>Gather, build, advance through the Ages and conquer</p>
      </div>
    </section>
  </main>
