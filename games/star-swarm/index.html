<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050816" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="canonical" href="https://www.retrowebgames.it/games/star-swarm/" />
  <title>Star Swarm — RetroWebGames</title>
  <link rel="manifest" href="../../manifest.webmanifest" />
  <link rel="stylesheet" href="../../style.css" />
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="Star Swarm"></canvas>

    <section id="hud" aria-live="polite">
      <div><span class="hud-label">SCORE</span><strong id="score">0</strong></div>
      <div><span class="hud-label">LEVEL</span><strong id="level">1</strong></div>
      <div><span class="hud-label">LIVES</span><strong id="lives">3</strong></div>
    </section>

    <div id="topbar">
      <a class="icon-btn nav-home" href="https://www.retrowebgames.it/" aria-label="Torna a RetroWebGames">⌂</a>
      <button id="muteBtn" class="icon-btn" aria-label="Attiva o disattiva audio">🔊</button>
      <button id="pauseBtn" class="icon-btn" aria-label="Pausa">Ⅱ</button>
    </div>

    <section id="overlay" class="visible">
      <div class="panel">
        <p class="eyebrow">RETROWEBGAMES • SPACE SHOOTER</p>
        <h1>STAR<br><span>SWARM</span></h1>
        <p id="overlayText">Trascina la nave con un dito. Il fuoco è automatico. Schiva le picchiate, distruggi la formazione e resisti il più possibile.</p>
        <div class="stats-line">BEST <strong id="best">0</strong></div>
        <button id="startBtn" class="primary-btn">GIOCA</button>
        <p class="hint">Consigliato in verticale • touch / mouse</p>
      </div>
    </section>
  </main>

  <script src="../../game.js"></script>
</body>
</html>
