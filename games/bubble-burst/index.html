<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#071126" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="canonical" href="https://www.retrowebgames.it/games/bubble-burst/" />
  <link rel="icon" type="image/svg+xml" href="https://www.retrowebgames.it/favicon.svg" />
  <link rel="shortcut icon" href="https://www.retrowebgames.it/favicon.svg" />
  <title>Bubble Burst — RetroWebGames</title>
  <link rel="manifest" href="../../manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../orientation.css" />
  <link rel="stylesheet" href="../../game-hud.css" />
</head>
<body data-rwg-game="true">
  <main id="app">
    <canvas id="game" aria-label="Bubble Burst"></canvas>

    <section id="hud" aria-live="polite">
      <div><span class="hud-label">SCORE</span><strong id="score">0</strong></div>
      <div><span class="hud-label">LEVEL</span><strong id="level">1</strong></div>
      <div><span class="hud-label">FALLI</span><strong id="misses">0/5</strong></div>
    </section>

    <div id="topbar">
      <a class="icon-btn" href="https://www.retrowebgames.it/" aria-label="Torna a RetroWebGames">⌂</a>
      <button id="muteBtn" class="icon-btn" aria-label="Attiva o disattiva audio">🔊</button>
      <button id="pauseBtn" class="icon-btn" aria-label="Pausa">Ⅱ</button>
    </div>

    <div id="nextBubble" aria-label="Prossima bolla"><span>NEXT</span><i></i></div>

    <section id="overlay" class="visible">
      <div class="panel">
        <p class="eyebrow">RETROWEBGAMES • BUBBLE SHOOTER</p>
        <h1>BUBBLE<br><span>BURST</span></h1>
        <p id="overlayText">200 configurazioni artistiche a difficoltà crescente. Crea gruppi da almeno 3, sfrutta Armor, Star e Prism Bubble e cerca le rare munizioni Bomba e Color Wipe.</p>
        <div class="stats-line">BEST <strong id="best">0</strong></div>
        <button id="startBtn" class="primary-btn">GIOCA</button>
        <p class="hint">Verticale • touch / mouse • rimbalzi sulle pareti</p>
      </div>
    </section>
  </main>

  <script src="levels.js"></script>
  <script src="game.js"></script>
  <script src="../../game-hud.js"></script>
  <script src="../../orientation.js"></script>
</body>
</html>
